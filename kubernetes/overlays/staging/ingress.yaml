apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backtester-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: backtester-staging.rath.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backtester
                port:
                  number: 5000
