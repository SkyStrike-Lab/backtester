apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homelab-staging
resources:
  - ../../base
  - ingress.yaml
patches:
  - target:
      version: v1
      kind: Deployment
      name: backtester
    path: patch-storage.yaml
images:
  - name: registry.home/backtester:placeholder
    newName: backtester-backtester
    newTag: latest
configMapGenerator:
  - name: backtester-config
    behavior: merge
    literals:
      - ENVIRONMENT=staging
      - BASE_PATH=""
