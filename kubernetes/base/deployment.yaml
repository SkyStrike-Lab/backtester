apiVersion: apps/v1
kind: Deployment
metadata:
  name: backtester
  labels:
    app: backtester
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backtester
  template:
    metadata:
      labels:
        app: backtester
    spec:
      containers:
        - name: backtester
          image: registry.home/backtester:placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: backtester-config
          volumeMounts:
            - name: backtester-data
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: backtester-data
          persistentVolumeClaim:
            claimName: backtester-data-pvc
